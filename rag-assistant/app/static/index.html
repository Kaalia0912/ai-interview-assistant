<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 应用工程师面经助手</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; background: #f7f8fa; }
    h1 { font-size: 20px; }
    .box { background: #fff; border-radius: 10px; padding: 16px; margin-top: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    textarea { width: 100%; min-height: 80px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 18px; border: none; border-radius: 8px; background: #2e6be6; color: #fff; cursor: pointer; font-size: 14px; }
    .sources { font-size: 13px; color: #555; border-top: 1px dashed #ddd; margin-top: 12px; padding-top: 10px; }
    .source { margin: 6px 0; }
    .cited { color: #2e7d32; }
    .uncited { color: #999; }
    .upload { font-size: 13px; color: #888; }
    #answer { white-space: pre-wrap; line-height: 1.7; }
  </style>
</head>
<body>
  <h1>AI 应用工程师面经助手</h1>

  <div class="box">
    <div class="upload">上传面经（md / txt / pdf / docx），上传即入库、永久保留，可多选：<input type="file" id="file" multiple></div>
  </div>

  <div class="box">
    <textarea id="q" placeholder="例如：上下文窗口超了怎么办？"></textarea>
    <br>
    <button onclick="ask()">提问</button>
  </div>

  <div class="box">
    <div id="answer">等待提问…</div>
    <div class="sources" id="sources"></div>
  </div>

  <script>
    async function ask() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      document.getElementById('answer').textContent = '思考中…';
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      document.getElementById('answer').textContent = data.answer || '（无回答）';
      const s = document.getElementById('sources');
      const cited = new Set();
      const matches = (data.answer || '').match(/\[\d+\]/g) || [];
      matches.forEach(t => cited.add(t.slice(1, -1)));
      s.innerHTML = '<b>参考资料（候选池，未引用的会被模型跳过）：</b>' + (data.sources || []).map((x, i) => {
        const n = String(i + 1);
        const tag = cited.has(n) ? '已引用' : '未引用';
        const cls = cited.has(n) ? 'cited' : 'uncited';
        return `<div class="source ${cls}">[${n}] 来源：${x.source}（相似度 ${x.score}）— ${tag}</div>`;
      }).join('');
    }

    document.getElementById('file').addEventListener('change', async (e) => {
      for (const f of e.target.files) {
        const fd = new FormData();
        fd.append('file', f);
        await fetch('/api/documents', { method: 'POST', body: fd });
      }
      alert('上传入库完成，可以提问了');
    });
  </script>
</body>
</html>
